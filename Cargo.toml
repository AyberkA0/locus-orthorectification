[package]
name = "locus-ortho"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
description = "Single-image orthorectification of oblique aerial views"
repository = "https://github.com/AyberkA0/locus-orthorectification"

[[bin]]
name = "locus-ortho"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lsdetect = "0.4"
ort = "=2.0.0-rc.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
